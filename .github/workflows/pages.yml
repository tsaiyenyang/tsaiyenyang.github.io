name: Deploy Lingua to GitHub Pages

on:
  push:
    branches:
      - main
      - translation-olivia
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          site_dir="$RUNNER_TEMP/lingua-pages"
          mkdir -p "$site_dir/assets/cats-cozy-home/sprites"
          cp index.html app.js styles.css "$site_dir/"
          cp assets/cats-cozy-home/sprites/*.png "$site_dir/assets/cats-cozy-home/sprites/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/lingua-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
